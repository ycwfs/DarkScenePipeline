   <g id="text_1">
    <text style="font-weight: 700; font-size: 27px; font-family: 'Noto Sans CJK JP'; text-anchor: start; fill: #172b43" x="66.24" y="60.430078" transform="rotate(-0 66.24 60.430078)">三部曲方案：照度门 → 取高分 → 先验判断</text>
   </g>
   <g id="text_2">
    <text style="font-size: 14px; font-family: 'Noto Sans CJK JP'; text-anchor: start; fill: #58697d" x="66.24" y="91.808125" transform="rotate(-0 66.24 91.808125)">与默认方案共用照度门；亮场改用分支竞争，并对指定动作追加必要条件</text>
   </g>
   <g id="text_3">
    <text style="font-size: 20px; font-family: 'Noto Sans CJK JP'; text-anchor: end; fill: #00867b" x="1105.2" y="53.90875" transform="rotate(-0 1105.2 53.90875)">02</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12px; font-family: 'Noto Sans CJK JP'; text-anchor: end; fill: #58697d" x="1105.2" y="91.505625" transform="rotate(-0 1105.2 91.505625)">可选模式 · max_prior</text>
   </g>
   <g id="text_5">
    <text style="font-size: 15px; font-family: 'Noto Sans CJK JP'; fill: #172b43" transform="translate(56.758125 178.68082)">视频输入 → 记录原图亮度 → 增强</text>
    <text style="font-size: 15px; font-family: 'Noto Sans CJK JP'; fill: #172b43" transform="translate(96.770625 200.622305)">最近 1 秒采样为 32 帧</text>
   </g>
   <g id="text_6">
    <text style="font-size: 16px; font-family: 'Noto Sans CJK JP'; fill: #172b43" transform="translate(389.2 178.232875)">原图亮度</text>
    <text style="font-size: 16px; font-family: 'Noto Sans CJK JP'; fill: #172b43" transform="translate(391.95125 201.637125)">L &lt; 75？</text>
   </g>
   <g id="text_7">
    <text style="font-size: 16px; font-family: 'Noto Sans CJK JP'; text-anchor: middle; fill: #172b43" x="646.2" y="189.935" transform="rotate(-0 646.2 189.935)">仅用 RGB 结果</text>
   </g>
   <g id="text_8">
    <text style="font-size: 16px; font-family: 'Noto Sans CJK JP'; fill: #172b43" transform="translate(76.83875 343.832875)">RGB 与骨架分别识别</text>
    <text style="font-size: 16px; font-family: 'Noto Sans CJK JP'; fill: #172b43" transform="translate(102.455 367.237125)">骨架最多 6 人</text>
   </g>
   <g id="text_9">
    <text style="font-size: 14px; font-family: 'Noto Sans CJK JP'; fill: #172b43" transform="translate(331.2 334.489406)">骨架取最高合格候选</text>
    <text style="font-size: 14px; font-family: 'Noto Sans CJK JP'; fill: #172b43" transform="translate(319.145781 354.968125)">非「其他」且分数 &gt;0.65</text>
    <text style="font-size: 14px; font-family: 'Noto Sans CJK JP'; fill: #172b43" transform="translate(336.763906 375.446844)">无候选则沿用 RGB</text>
   </g>
   <g id="text_10">
    <text style="font-size: 15px; font-family: 'Noto Sans CJK JP'; fill: #172b43" transform="translate(564 344.28082)">两分支取置信度更高者</text>
    <text style="font-size: 15px; font-family: 'Noto Sans CJK JP'; fill: #172b43" transform="translate(568.566797 366.222305)">低于 0.65 →「其他」</text>
   </g>
   <g id="text_11">
