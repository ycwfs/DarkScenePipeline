    <text style="font-size: 10.5px; font-family: 'Noto Sans CJK JP'; text-anchor: start; fill: #58697d" x="46.08" y="623.873672" transform="rotate(-0 46.08 623.873672)">历史 pn / 长边 840；两模式的骨架汇总方式不同。P 为回传负样本记录，含训练内数据及标注歧义。</text>
