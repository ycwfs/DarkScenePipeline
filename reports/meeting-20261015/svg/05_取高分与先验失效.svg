   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Noto Sans CJK JP'; text-anchor: start; fill: #172b43" x="54" y="152.709687" transform="rotate(-0 54 152.709687)">触发类别及先验路径</text>
   </g>
   <g id="text_6">
    <text style="font-size: 14px; font-family: 'Noto Sans CJK JP'; text-anchor: start; fill: #172b43" x="68.4" y="549.728125" transform="rotate(-0 68.4 549.728125)">红色：110 个无先验    棕色：40 个经先验放行</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Noto Sans CJK JP'; text-anchor: start; fill: #172b43" x="608.4" y="152.709687" transform="rotate(-0 608.4 152.709687)">一个真实日志窗口的分支竞争</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Noto Sans CJK JP'; text-anchor: start; fill: #2463b6" x="626.4" y="221.829687" transform="rotate(-0 626.4 221.829687)">RGB：其他 84.0%</text>
   </g>
   <g id="text_9">
    <text style="font-size: 14px; font-family: 'Noto Sans CJK JP'; text-anchor: start; fill: #172b43" x="626.4" y="249.488125" transform="rotate(-0 626.4 249.488125)">RGB 对「追逐」仅给出 0.51%</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Noto Sans CJK JP'; text-anchor: start; fill: #c54f38" x="626.4" y="315.429687" transform="rotate(-0 626.4 315.429687)">骨架候选：追逐 90.4%</text>
   </g>
   <g id="text_11">
    <text style="font-size: 14px; font-family: 'Noto Sans CJK JP'; text-anchor: start; fill: #172b43" x="626.4" y="343.088125" transform="rotate(-0 626.4 343.088125)">三部曲取更高分 → 追逐；该动作没有先验</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Noto Sans CJK JP'; text-anchor: start; fill: #00867b" x="626.4" y="414.789688" transform="rotate(-0 626.4 414.789688)">同窗加权融合 → 其他</text>
   </g>
   <g id="text_13">
    <text style="font-size: 15px; font-family: 'Noto Sans CJK JP'; text-anchor: start; fill: #172b43" x="626.4" y="448.491562" transform="rotate(-0 626.4 448.491562)">融合后追逐分数 24.8%，低于 0.65</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 17px; font-family: 'Noto Sans CJK JP'; text-anchor: start; fill: #172b43" x="608.4" y="518.315234" transform="rotate(-0 608.4 518.315234)">分支分数高，并不能保证动作判断正确。</text>
   </g>
   <g id="text_15">
    <text style="font-size: 11px; font-family: 'Noto Sans CJK JP'; text-anchor: start; fill: #58697d" x="608.4" y="550.317812" transform="rotate(-0 608.4 550.317812)">案例：P0029 / t0.5；融合值取自日志，非另行推算。</text>
   </g>
