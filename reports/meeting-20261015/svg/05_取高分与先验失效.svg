   <g id="text_1">
    <text style="font-weight: 700; font-size: 27px; font-family: 'Noto Sans CJK JP'; text-anchor: start; fill: #172b43" x="66.24" y="60.430078" transform="rotate(-0 66.24 60.430078)">取高分放大骨架误判，先验覆盖也不完整</text>
   </g>
   <g id="text_2">
    <text style="font-size: 14px; font-family: 'Noto Sans CJK JP'; text-anchor: start; fill: #58697d" x="66.24" y="91.808125" transform="rotate(-0 66.24 91.808125)">三部曲的 150 个负样本触发窗口：149 个由骨架分支胜出，110 个没有适用先验</text>
   </g>
   <g id="text_3">
    <text style="font-size: 20px; font-family: 'Noto Sans CJK JP'; text-anchor: end; fill: #00867b" x="1105.2" y="53.90875" transform="rotate(-0 1105.2 53.90875)">05</text>
